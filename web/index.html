<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Texas Hold'em</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <h1 id="title"></h1>
    <span id="meta" class="meta"></span>
    <!-- Once seated. With other people at the table, ending or restarting is put to a vote. -->
    <span id="manage" class="manage" hidden>
      <button id="end-game" class="quiet" type="button"></button>
      <button id="new-game" class="quiet" type="button"></button>
      <button id="leave" class="quiet destructive" type="button"></button>
      <button id="close-table" class="quiet destructive" type="button" hidden></button>
    </span>
    <span id="conn" class="conn" role="status"></span>
    <button id="lang" class="quiet" type="button"></button>
  </header>

  <!-- The lobby: your name, the tables, a new table -->
  <main id="join" class="join">
    <section class="card-panel lobby-panel">
      <h2 id="lobby-title"></h2>
      <label for="name" id="join-label"></label>
      <input id="name" name="name" maxlength="24" autocomplete="nickname">
      <p id="join-error" class="error" role="alert"></p>
      <ul id="tables" class="tables"></ul>
      <button id="create-open" type="button"></button>
      <p id="join-hint" class="hint"></p>
    </section>
  </main>

  <!-- At the table -->
  <main id="game" class="game" hidden>
    <section class="play">
      <div id="vote" class="vote" role="status" hidden></div>
      <div id="table" class="table">
        <div class="felt"></div>
        <div id="center" class="center"></div>
        <div id="seats" class="ring"></div>
      </div>
      <div class="dock">
        <div id="mine" class="mine"></div>
        <div id="actions" class="actions"></div>
      </div>
      <p id="notice" class="notice" role="alert"></p>
    </section>
    <aside class="side">
      <div class="side-head">
        <!-- What happened, or what people said -->
        <div class="segmented side-tabs" role="tablist">
          <button id="tab-log" class="on" type="button" role="tab" aria-selected="true" aria-controls="log"></button>
          <button id="tab-chat" type="button" role="tab" aria-selected="false" aria-controls="chat"><span id="tab-chat-label"></span><span id="unread" class="unread" hidden></span></button>
        </div>
        <button id="summary-button" class="quiet" type="button" hidden></button>
      </div>
      <ol id="log" class="log" role="tabpanel"></ol>
      <section id="chat" class="chat" role="tabpanel" hidden>
        <ol id="chat-lines" class="chat-lines" aria-live="polite"></ol>
        <div id="phrases" class="phrases"></div>
        <form id="chat-form" class="chat-form" autocomplete="off">
          <input id="chat-input" maxlength="200" enterkeyhint="send">
          <button id="chat-send" class="send" type="submit">↑</button>
        </form>
      </section>
    </aside>
  </main>

  <dialog id="summary" class="summary"></dialog>
  <dialog id="standings" class="summary"></dialog>
  <dialog id="confirm" class="summary confirm"></dialog>
  <dialog id="bots" class="summary"></dialog>
  <dialog id="create" class="summary"></dialog>
  <dialog id="password" class="summary"></dialog>

  <noscript>This page needs JavaScript to play.</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
