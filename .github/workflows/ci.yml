name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build server, stats tool and bots
        run: make
      - name: Short bot match
        run: |
          ./thmatch --hands 500 equity rules calling random
          ./thmatch --hands 500 rl equity rules calling
      - name: Run tests (AddressSanitizer + UBSan)
        run: make test
      - name: Web client tests
        run: make test-web
      - name: The server hands out the web page
        run: |
          ./thserver --port 4190 --web-port 8190 --no-history &
          server=$!
          sleep 1
          curl --fail --silent http://localhost:8190/ | grep -q '<script type="module" src="app.js">'
          curl --fail --silent http://localhost:8190/app.js | grep -q 'WebSocket'
          # Nothing outside web/ is handed out.
          test "$(curl --silent --path-as-is --output /dev/null --write-out '%{http_code}' http://localhost:8190/../Makefile)" = 404
          kill $server
