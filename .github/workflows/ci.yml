name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build server, stats tool and bots
        run: make
      - name: Short bot match
        run: ./thmatch --hands 500 equity rules calling random
      - name: Run tests (AddressSanitizer + UBSan)
        run: make test
